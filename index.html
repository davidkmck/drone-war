<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geo-Hex Tactical Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="hud-panel">
    <strong>Geo-Hex Tactics</strong><br/>
    Selected Hex: <span id="selected-hex">None</span>

      <!-- Action Buttons Panel -->
      <div id="action-panel" class="action-panel hidden">
        <div class="panel-title">Hex Actions</div>
        <div class="button-group">
          <button class="btn btn-deploy" onclick="showDeployMenu()">Deploy Unit</button>
          <button class="btn btn-strike" onclick="showStrikeMenu()">Long-Range Strike</button>
        </div>
      </div>
    
      <!-- Submenu for Unit Deployment -->
      <div id="deploy-menu" class="action-panel hidden">
        <div class="panel-title">Select Unit to Deploy</div>
        <button class="btn" onclick="executeDeploy('INFANTRY')">🪖 Infantry ($100)</button>
        <button class="btn" onclick="executeDeploy('INTERCEPTOR')">🛸 Interceptor Drone ($250)</button>
        <button class="btn" onclick="executeDeploy('LOGISTICS_TRUCK')">🚚 Supply Truck ($200)</button>
        <button class="btn btn-cancel" onclick="resetMenus()">Cancel</button>
      </div>
    
      <!-- Submenu for Long-Range Strikes -->
      <div id="strike-menu" class="action-panel hidden">
        <div class="panel-title">Target Selected Hex</div>
        <button class="btn" onclick="executeStrike('CHEAP_LR_DRONE')">🛩️ Cheap LR Drone ($400)</button>
        <button class="btn" onclick="executeStrike('CRUISE_MISSILE')">🚀 Cruise Missile ($2000)</button>
        <button class="btn btn-cancel" onclick="resetMenus()">Cancel</button>
      </div>

    <div class="layer-toggles">
  <label><input type="checkbox" id="toggle-borders" checked onchange="toggleLayer('borders')"> Borders & Cities</label><br/>
  <label><input type="checkbox" id="toggle-military" checked onchange="toggleLayer('military')"> Airfields & Bases</label>
</div>
  </div>

  <div id="map"></div>

  <!-- External Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- original <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.js"></script> -->
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

  <!-- Load helper scripts BEFORE app.js -->
<script src="units.js"></script>
<script src="terrain.js"></script>
  <script src="landmarks.js"></script>
  
  <!-- Main Application Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
